name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Only the upstream repo publishes; forks and PRs stop after the checks.
      PUBLISH: ${{ github.event_name == 'push' && github.repository == 'diegoaranas/melee-combos' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs the history and tags
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: npm ci
      - run: for f in *.js; do node --check "$f"; done
      # Checks the exe builds on every push and PR.
      - run: node build.js check

      # Picks the next version from the Conventional Commits since the last tag, builds the exe
      # (build.js) and creates the GitHub release with it attached (config in package.json).
      # No release-worthy commits = no release.
      - if: env.PUBLISH == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
